<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Q&A System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .output-section {
            display: none;
        }
        
        .output-section.show {
            display: block;
        }
        
        .answer-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .answer-box h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .answer-text {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .sources-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #764ba2;
        }
        
        .sources-box h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .source-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 3px;
            color: #666;
            font-size: 14px;
        }
        
        .error-box {
            background: #fee;
            padding: 15px;
            border-radius: 5px;
            color: #c33;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .status-ok {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 RAG Document Q&A System</h1>
        <div class="subtitle">
            Ask questions about your documents
            <span class="status-badge {% if rag_available %}status-ok{% else %}status-error{% endif %}">
                {% if rag_available %}✓ Ready{% else %}✗ Offline{% endif %}
            </span>
        </div>
        
        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask a question..." 
                    disabled="{% if not rag_available %}true{% endif %}"
                >
                <button id="askBtn" onclick="askQuestion()" disabled="{% if not rag_available %}true{% endif %}">
                    Ask
                </button>
            </div>
        </div>
        
        <div id="errorBox" class="error-box" style="display: none;"></div>
        
        <div id="outputSection" class="output-section">
            <div id="loadingBox" class="loading" style="display: none;">
                ⏳ Searching documents...
            </div>
            
            <div id="answerBox" class="answer-box" style="display: none;">
                <h3>Answer:</h3>
                <div id="answerText" class="answer-text"></div>
            </div>
            
            <div id="sourcesBox" class="sources-box" style="display: none;">
                <h3>Sources:</h3>
                <div id="sourcesList"></div>
            </div>
        </div>
    </div>
    
    <script>
        function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            
            if (!question) {
                showError('Please enter a question');
                return;
            }
            
            showLoading(true);
            clearError();
            
            fetch('/api/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ question: question })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                
                if (data.status === 'success') {
                    displayAnswer(data.answer, data.sources);
                } else {
                    showError(data.error || 'An error occurred');
                }
            })
            .catch(error => {
                showLoading(false);
                showError(`Error: ${error.message}`);
            });
        }
        
        function displayAnswer(answer, sources) {
            document.getElementById('outputSection').classList.add('show');
            document.getElementById('answerText').textContent = answer;
            document.getElementById('answerBox').style.display = 'block';
            
            if (sources && sources.length > 0) {
                const sourcesList = document.getElementById('sourcesList');
                sourcesList.innerHTML = sources
                    .map(s => `<div class="source-item">📄 ${s.source} | Page ${s.page}</div>`)
                    .join('');
                document.getElementById('sourcesBox').style.display = 'block';
            }
        }
        
        function showLoading(show) {
            document.getElementById('loadingBox').style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }
        
        function clearError() {
            document.getElementById('errorBox').style.display = 'none';
        }
        
        // Allow Enter key to submit
        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.getElementById('askBtn').disabled) {
                askQuestion();
            }
        });
        
        // Enable/disable input based on RAG availability
        const ragAvailable = {% if rag_available %}true{% else %}false{% endif %};
        if (!ragAvailable) {
            document.getElementById('questionInput').disabled = true;
            document.getElementById('askBtn').disabled = true;
            showError('RAG system is not available. Please check your setup.');
        }
    </script>
</body>
</html>
